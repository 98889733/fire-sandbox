<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#0e0e12;overflow:hidden;touch-action:none;font-family:sans-serif}
#c{display:block;image-rendering:pixelated}
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;gap:6px;padding:6px;box-sizing:border-box;overflow-x:auto;background:#1a1a22}
button{flex:0 0 auto;padding:0 12px;border:2px solid #333;border-radius:10px;background:#272733;color:#eee;font-size:14px}
button.on{border-color:#ffb030;background:#3a2c1a}
</style></head><body><canvas id="c"></canvas><div id="bar"></div>
<script>
const E=0,COAL=1,FIRE=2,SMOKE=3,WATER=4,STEAM=5,FANR=6,FANL=7,WALL=8,EMBER=9,ASH=10,R=Math.random,CS=3;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,t,l,wd,img,buf,tool=COAL,down=false,px=0,py=0;
function init(){W=Math.floor(innerWidth/CS);H=Math.floor((innerHeight-64)/CS);cv.width=W;cv.height=H;
cv.style.width=W*CS+'px';cv.style.height=H*CS+'px';t=new Uint8Array(W*H);l=new Int16Array(W*H);wd=new Uint8Array(W*H);
img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer)}
init();addEventListener('resize',init);
const tools=[['Уголь',1],['Огонь',2],['Вода',4],['Вент. →',6],['Вент. ←',7],['Стена',8],['Пепел',10],['Ластик',0]];
const bar=document.getElementById('bar');
tools.forEach(([n,v])=>{const b=document.createElement('button');b.textContent=n;if(v==tool)b.className='on';
b.onclick=()=>{tool=v;[...bar.children].forEach(x=>x.className='');b.className='on'};bar.appendChild(b)});
const cl=document.createElement('button');cl.textContent='Очистить';cl.onclick=()=>{t.fill(0);l.fill(0)};bar.appendChild(cl);
function pos(e){px=e.clientX;py=e.clientY}
cv.addEventListener('pointerdown',e=>{down=true;pos(e)});
addEventListener('pointermove',e=>{if(down)pos(e)});
addEventListener('pointerup',()=>down=false);addEventListener('pointercancel',()=>down=false);
const gasT=a=>a==2||a==3||a==5;
function mv(a,b){t[b]=t[a];l[b]=l[a];t[a]=0;l[a]=0}
function sw(a,b){const x=t[a],y=l[a];t[a]=t[b];l[a]=l[b];t[b]=x;l[b]=y}
function sp(x,y,tp,life){if(x<0||y<0||x>=W||y>=H)return false;const j=y*W+x;if(t[j])return false;t[j]=tp;l[j]=life;return true}
function cnt(x,y,a,b){let n=0;for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){if(!j&&!k)continue;const xx=x+k,yy=y+j;
if(xx<0||yy<0||xx>=W||yy>=H)continue;const q=t[yy*W+xx];if(q==a||q==b)n++}return n}
function paint(){const cx=Math.floor(px/CS),cy=Math.floor(py/CS);if(cy>=H)return;
const r=(tool==WALL||tool==FANR||tool==FANL)?1:3;
for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r)continue;const x=cx+dx,y=cy+dy;
if(x<0||y<0||x>=W||y>=H)continue;const i=y*W+x;
if(tool==0){t[i]=0;l[i]=0;continue}
if(tool==FIRE){if(t[i]==COAL){t[i]=EMBER;l[i]=300+R()*200|0}else if(t[i]==0&&R()<.6){t[i]=FIRE;l[i]=30+R()*30|0}continue}
if(t[i]!=0)continue;
if(tool==WALL||tool==FANR||tool==FANL){t[i]=tool}
else if(R()<.4){t[i]=tool;l[i]=0}}}
function can(j,liq){const q=t[j];return q==0||gasT(q)||(!liq&&q==WATER)}
function fall(i,x,y,liq){
if(y<H-1){const d=i+W;if(can(d,liq)){sw(i,d);return}
const s=R()<.5?-1:1;
for(const o of[s,-s]){const nx=x+o;if(nx<0||nx>=W)continue;if(can(d+o,liq)&&can(i+o,liq)){sw(i,d+o);return}}}
if(liq){const o=R()<.5?-1:1;for(let k=1;k<=3;k++){const nx=x+o*k;if(nx<0||nx>=W)break;const j=i+o*k;
if(t[j]==0){sw(i,j);return}else if(!can(j,true))break}}}
function gas(i,x,y,up){let dx=0,dy=0;
if(wd[i]&&R()<.85)dx=wd[i]==1?1:-1;else if(R()<.35)dx=R()<.5?-1:1;
if(R()<up)dy=-1;
for(const[a,b]of[[dx,dy],[0,dy],[dx,0]]){if(!a&&!b)continue;const nx=x+a,ny=y+b;
if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(t[j]==0){mv(i,j);return}}}
function blow(){wd.fill(0);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const tp=t[y*W+x];if(tp!=FANR&&tp!=FANL)continue;
const d=tp==FANR?1:-1,fx=x+d;if(fx<0||fx>=W||t[y*W+fx]==tp)continue;
for(let k=1;k<=45;k++){const xx=x+d*k;if(xx<0||xx>=W)break;if(t[y*W+xx]==WALL)break;const s=(k/9)|0;
for(let yy=y-s;yy<=y+s;yy++){if(yy<0||yy>=H)continue;const j=yy*W+xx;
if(t[j]!=WALL&&t[j]!=FANR&&t[j]!=FANL)wd[j]=d>0?1:2}}}}
function step(){
for(let y=H-1;y>=0;y--){const rv=R()<.5;
for(let k=0;k<W;k++){const x=rv?k:W-1-k,i=y*W+x,tp=t[i];if(!tp)continue;
if(tp==COAL){const f=cnt(x,y,FIRE,EMBER);
if(f&&R()<.04*f*(wd[i]?3:1)){t[i]=EMBER;l[i]=250+R()*250|0}else fall(i,x,y,false)}
else if(tp==EMBER){l[i]-=wd[i]?4:1;
if(cnt(x,y,WATER,WATER)&&R()<.2){t[i]=ASH;l[i]=0;sp(x,y-1,STEAM,80+R()*60|0)}
else if(l[i]<=0){t[i]=ASH;l[i]=0}
else{const p=.06+(wd[i]?.3:0);if(R()<p)sp(x+(R()*3|0)-1,y-1,FIRE,18+R()*22|0);
if(R()<.004)sp(x,y-1,SMOKE,150+R()*100|0);fall(i,x,y,false)}}
else if(tp==ASH)fall(i,x,y,false);
else if(tp==WATER){const h=cnt(x,y,FIRE,EMBER);
if(h&&R()<.04*h){t[i]=STEAM;l[i]=120+R()*80|0}else fall(i,x,y,true)}}}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,tp=t[i];if(!gasT(tp))continue;l[i]--;
if(tp==FIRE){if(l[i]<=0){if(R()<.35){t[i]=SMOKE;l[i]=120+R()*100|0}else t[i]=0;continue}
if(R()<.1&&cnt(x,y,WATER,WATER)){t[i]=STEAM;l[i]=100;continue}gas(i,x,y,.65)}
else if(tp==SMOKE){if(l[i]<=0){t[i]=0;continue}gas(i,x,y,.55)}
else{if(l[i]<=0){t[i]=R()<.4?WATER:0;l[i]=0;continue}gas(i,x,y,.8)}}}
const rgb=(r,g,b)=>0xff000000|(b&255)<<16|(g&255)<<8|(r&255);
function draw(){for(let i=0;i<W*H;i++){const tp=t[i],h=((i*2654435761)>>>0)>>>28;let c;
switch(tp){
case 0:c=0xff120e0e;break;
case COAL:c=rgb(30+h,30+h,34+h);break;
case EMBER:{const f=Math.min(1,l[i]/150);c=rgb(120+135*f*(.7+.3*R()),20+80*f*R(),0);break}
case FIRE:c=l[i]>25?rgb(255,220+R()*30,90):l[i]>12?rgb(255,140+R()*40,20):rgb(210,50+R()*30,15);break;
case SMOKE:{const v=45+Math.min(l[i],120)*.35;c=rgb(v,v,v+3);break}
case WATER:c=rgb(25,85+R()*25,215);break;
case STEAM:{const v=20+170*Math.min(1,l[i]/80);c=rgb(v,v+8,v+18);break}
case FANR:case FANL:c=rgb(150,160,175);break;
case WALL:c=rgb(95,75,65);break;
default:c=rgb(125+h*2,125+h*2,120+h*2)}
buf[i]=c}ctx.putImageData(img,0,0)}
function loop(){if(down)paint();blow();step();draw();requestAnimationFrame(loop)}
loop();
</script></body></html>
